<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>当日受付｜北中城村ウェルネススポーツフェスタ2026</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="style.css?v=20261113a">
</head>
<body class="checkin-body">

<main>
  <div class="wrap">

    <h1 style="padding-top:20px;">当日受付</h1>

    <!-- ① PIN -->
    <section id="pin-area">
      <div class="card">
        <h2>合言葉を入れてください</h2>
        <p class="muted">スタッフ用の画面です。なつきさんから伝えられた合言葉（8文字以上）を入れてください。</p>
        <div class="field">
          <label for="pin">合言葉</label>
          <input type="password" id="pin" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" maxlength="64">
        </div>
        <div id="pin-msg"></div>
        <button type="button" class="btn btn-main" id="pin-btn">開く</button>
      </div>
    </section>

    <!-- ② 受付本体 -->
    <section id="desk-area" hidden>
      <div style="display:flex;justify-content:flex-end;margin:-8px 0 10px;">
        <button type="button" class="btn btn-line" id="lock-btn" style="width:auto;min-height:36px;padding:6px 12px;font-size:14px;margin:0;">ロック画面にもどる（合言葉を入れ直す）</button>
      </div>

      <div class="card">
        <h2>予約の確認</h2>
        <div class="btn-row">
          <button type="button" class="btn btn-main" id="scan-btn">QRを読む</button>
          <button type="button" class="btn btn-line" id="scan-stop" hidden>カメラを止める</button>
        </div>
        <label class="btn btn-line" style="margin-top:8px;">写真でQRを読む（カメラが動かないとき）<input type="file" id="photo-qr" accept="image/*" capture="environment" hidden></label>
        <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:8px;">
          <label class="check" style="flex:1 1 240px;margin-bottom:0;"><input type="checkbox" id="auto-checkin" checked><span class="t"><b>QRを読んだら、そのまま「来場」にする</b><span>外すと、名前を見てから「来場にする」を押す形になります</span></span></label>
          <label class="check" style="flex:1 1 190px;margin-bottom:0;"><input type="checkbox" id="sound-on" checked><span class="t"><b>🔊 読み取り音を鳴らす</b><span>完了・2回目・取消を音と振動でお知らせ</span></span></label>
        </div>
        <div id="reader-box" hidden>
          <video id="video" playsinline muted></video>
          <div class="reader-guide"></div>
          <p class="reader-hint">QRを枠の中に大きく映してください（画面のQRでもOK）</p>
        </div>
        <canvas id="canvas" hidden></canvas>

        <div class="field" style="margin-top:16px;">
          <label for="no">番号を入力（KF-0000）</label>
          <input type="text" id="no" inputmode="text" autocomplete="off" placeholder="KF-0012">
        </div>
        <button type="button" class="btn btn-sub" id="lookup-btn">この番号で調べる</button>
        <div id="desk-msg"></div>

        <!-- 名前と生年月日で探す（QRも番号も出せない方むけ・2026-11-11） -->
        <div id="search-box" style="margin-top:20px;padding-top:14px;border-top:1px dashed #5A5449;">
          <p style="margin:0 0 8px;font-weight:700;">名前と生年月日で探す</p>
          <p class="small" style="margin:0 0 10px;">QRも番号も出せない方に。ご家族のどなたのお名前でも探せます（お子さまでもOK）。</p>
          <div class="field" style="margin-bottom:8px;">
            <label for="s-name">お名前</label>
            <input type="text" id="s-name" autocomplete="off" placeholder="テスト花子">
          </div>
          <div class="field" style="margin-bottom:8px;">
            <label for="s-birth">生年月日</label>
            <input type="text" id="s-birth" inputmode="numeric" autocomplete="off" placeholder="1985/4/1">
          </div>
          <button type="button" class="btn btn-sub" id="search-btn">探す</button>
          <p class="small" id="search-demo" hidden style="margin:6px 0 0;">テスト表示：「テスト花子」で1件、「テスト家族」で複数、それ以外の名前は0件になります（生年月日は何でも可）。</p>
          <div id="search-list" style="margin-top:8px;"></div>
        </div>
      </div>

      <!-- 照会結果 -->
      <div class="card" id="result-card" hidden>
        <div id="r-banner" class="r-banner" hidden></div>
        <p class="person-no" id="r-no"></p>
        <p class="person-name" id="r-name"></p>
        <p id="r-kana" class="muted"></p>
        <p><span class="badge-big" id="r-badge"></span></p>
        <p class="muted" id="r-count"></p>
        <div id="r-booths"></div>
        <div id="r-spot" hidden style="margin-top:12px;"></div>
        <div id="r-actions" style="margin-top:16px;"></div>
        <div id="r-booth-mode-wrap" style="margin-top:14px;padding-top:10px;border-top:1px dashed #4A463B;">
          <label class="small" style="display:inline-flex;align-items:center;gap:8px;cursor:pointer;color:#C9C3B4;">
            <input type="checkbox" id="booth-staff-mode" style="width:20px;height:20px;accent-color:#2F6B5A;">
            <span>ブース担当者用（「体験おわり」ボタンを押す）</span>
          </label>
        </div>
      </div>

      <!-- 予約なしの方の来場登録 -->
      <div class="card">
        <h2>予約なしの方の来場登録</h2>
        <p class="muted">その場で番号を発番します。</p>
        <p class="muted">入り口の紙（名前・生年月日・住所・連絡先）を見て、来た人 全員を入れます。1行目が代表の方。</p>
        <div id="w-people"></div>
        <button type="button" class="btn btn-line" id="w-add">＋ 人を追加する</button>
        <div class="field">
          <label for="w-address">住所</label>
          <input type="text" id="w-address" autocomplete="off">
        </div>
        <div class="field">
          <label for="w-phone">電話</label>
          <input type="tel" id="w-phone" inputmode="tel" autocomplete="off">
        </div>
        <button type="button" class="btn btn-go" id="walkin-btn">来場を登録する</button>
        <div id="walkin-msg" style="margin-top:12px;"></div>
      </div>

      <p class="small"><a href="index.html">予約サイトにもどる</a></p>
    </section>

  </div>
</main>

<script src="jsQR.js?v=20261016a"></script>
<script src="config.js?v=20261016a"></script>
<script src="booths.js?v=20261110b"></script>
<script src="app.js?v=20261113a"></script>
<script>
(function () {
  "use strict";
  var F = window.Festa, esc = F.esc;
  var PIN = "";
  var PIN_STORAGE_KEY = "kitanaka_checkin_pin";
  var SOUND_STORAGE_KEY = "kitanaka_checkin_sound";
  var BOOTH_MODE_KEY = "kitanaka_booth_staff_mode";
  var demoCame = {};

  F.showDemoBar("テスト表示中です（受付係がまだつながっていないため、記録は残りません）");

  function box(el, kind, text) {
    el.innerHTML = '<div class="msg msg-' + kind + '">' + esc(text) + "</div>";
  }

  /* ---------- 確認音（Web Audio API）＆バイブレーション ---------- */
  var audioCtx = null;
  var soundChk = F.$("#sound-on");
  try {
    var savedSound = sessionStorage.getItem(SOUND_STORAGE_KEY) || localStorage.getItem(SOUND_STORAGE_KEY);
    if (savedSound === "0") soundChk.checked = false;
  } catch (e) { }
  soundChk.addEventListener("change", function () {
    var v = soundChk.checked ? "1" : "0";
    try { sessionStorage.setItem(SOUND_STORAGE_KEY, v); localStorage.setItem(SOUND_STORAGE_KEY, v); } catch (e) { }
    if (soundChk.checked) unlockAudio_();
  });

  function unlockAudio_() {
    try {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      if (!audioCtx) audioCtx = new AC();
      if (audioCtx.state === "suspended") audioCtx.resume();
      return audioCtx;
    } catch (e) { return null; }
  }

  function playTone_(ac, freq, startOffset, duration, type, gainVal) {
    var osc = ac.createOscillator();
    var g = ac.createGain();
    osc.type = type || "sine";
    osc.frequency.setValueAtTime(freq, ac.currentTime + startOffset);
    g.gain.setValueAtTime(gainVal || 0.18, ac.currentTime + startOffset);
    g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + startOffset + duration);
    osc.connect(g);
    g.connect(ac.destination);
    osc.start(ac.currentTime + startOffset);
    osc.stop(ac.currentTime + startOffset + duration);
  }

  /* kind: "scan"（ピッ） | "ok"（ピロリン♪） | "already"（ピピッ） | "err"（ブー） */
  function playFeedback(kind) {
    if (!soundChk || !soundChk.checked) return;
    try {
      if (navigator.vibrate) {
        if (kind === "scan") navigator.vibrate(35);
        else if (kind === "ok") navigator.vibrate([60, 40, 100]);
        else if (kind === "already") navigator.vibrate([80, 60, 80]);
        else if (kind === "err") navigator.vibrate([200, 80, 200]);
      }
    } catch (e) { }
    try {
      var ac = unlockAudio_();
      if (!ac) return;
      if (kind === "scan") {
        playTone_(ac, 1200, 0, 0.06, "sine", 0.15);
      } else if (kind === "ok") {
        playTone_(ac, 880, 0, 0.09, "sine", 0.22);
        playTone_(ac, 1318.5, 0.09, 0.18, "sine", 0.24);
      } else if (kind === "already") {
        playTone_(ac, 740, 0, 0.08, "triangle", 0.25);
        playTone_(ac, 740, 0.13, 0.12, "triangle", 0.25);
      } else if (kind === "err") {
        playTone_(ac, 220, 0, 0.18, "sawtooth", 0.22);
        playTone_(ac, 175, 0.16, 0.24, "sawtooth", 0.24);
      }
    } catch (e) { }
  }

  /* ---------- ブース担当者用（「体験おわり」ボタン誤タップ防止） ---------- */
  var boothModeChk = F.$("#booth-staff-mode");
  var resultCard = F.$("#result-card");
  function syncBoothStaffMode_() {
    var on = !!(boothModeChk && boothModeChk.checked);
    resultCard.classList.toggle("is-booth-staff", on);
    F.$$("[data-part]", resultCard).forEach(function (btn) {
      btn.hidden = !on;
    });
  }
  try {
    if (sessionStorage.getItem(BOOTH_MODE_KEY) === "1") boothModeChk.checked = true;
  } catch (e) { }
  boothModeChk.addEventListener("change", function () {
    try { sessionStorage.setItem(BOOTH_MODE_KEY, boothModeChk.checked ? "1" : "0"); } catch (e) { }
    syncBoothStaffMode_();
  });
  syncBoothStaffMode_();

  /* ---------- ① PIN（sessionStorage保持＆POST認証） ---------- */
  function openDesk_(v) {
    PIN = v;
    try { sessionStorage.setItem(PIN_STORAGE_KEY, v); } catch (e) { }
    F.$("#pin-area").hidden = true;
    F.$("#desk-area").hidden = false;
  }

  function backToPinScreen_(errMsg) {
    stopScan();
    PIN = "";
    try { sessionStorage.removeItem(PIN_STORAGE_KEY); } catch (e) { }
    F.$("#desk-area").hidden = true;
    F.$("#result-card").hidden = true;
    F.$("#pin-area").hidden = false;
    if (errMsg) box(F.$("#pin-msg"), "err", errMsg);
    else F.$("#pin-msg").innerHTML = "";
  }

  function isAuthOrSetupError_(j) {
    var code = j && j.error;
    return code === "pin" || code === "auth" || code === "locked" || code === "setup";
  }

  function handleAuthError_(j) {
    if (!isAuthOrSetupError_(j)) return false;
    playFeedback("err");
    var msg = (j.error === "setup")
      ? "受付係の合言葉の設定が終わっていません（未設定か8文字より短い）。なつきさんに連絡してください。"
      : F.friendlyError(j.error);
    backToPinScreen_(msg);
    return true;
  }

  /* すでにこのタブでPIN確認ずみなら、再読み込みしてもすぐ受付画面を開く */
  try {
    var savedPin = sessionStorage.getItem(PIN_STORAGE_KEY) || "";
    if (savedPin) {
      F.$("#pin").value = savedPin;
      openDesk_(savedPin);
    }
  } catch (e) { }

  F.$("#lock-btn").addEventListener("click", function () {
    F.$("#pin").value = "";
    backToPinScreen_("");
  });

  function tryPin() {
    unlockAudio_();
    var v = F.$("#pin").value.trim();
    if (!v) { box(F.$("#pin-msg"), "err", "合言葉を入れてください。"); return; }
    if (F.isDemo()) {
      if (v !== String(F.CFG.checkinPin)) { playFeedback("err"); box(F.$("#pin-msg"), "err", F.friendlyError("pin")); return; }
      playFeedback("ok");
      openDesk_(v);
      return;
    }
    /* 本番は受付係（GAS）に POST で聞く（URLにPINを残さない・v1.3.2/v1.3.3 両対応） */
    box(F.$("#pin-msg"), "info", "確認しています…");
    F.postGas({ action: "search", name: "__pin_check__", birth: "20000101", pin: v }).then(function (j) {
      if (j && j.error === "pin") { playFeedback("err"); box(F.$("#pin-msg"), "err", F.friendlyError("pin")); return; }
      if (j && j.error === "locked") { playFeedback("err"); box(F.$("#pin-msg"), "err", F.friendlyError("locked")); return; }
      if (j && j.error === "setup") { playFeedback("err"); box(F.$("#pin-msg"), "err", "受付係の合言葉の設定が終わっていません（未設定か8文字より短い）。なつきさんに連絡してください。"); return; }
      F.$("#pin-msg").innerHTML = "";
      playFeedback("ok");
      openDesk_(v);
    }).catch(function () { playFeedback("err"); box(F.$("#pin-msg"), "err", F.friendlyError("network")); });
  }
  document.addEventListener("click", function (e) {
    var bt = e.target.closest ? e.target.closest("[data-part]") : null;
    if (!bt) return;
    if (!boothModeChk || !boothModeChk.checked) return;
    var bid = bt.getAttribute("data-part"), rno = bt.getAttribute("data-no");
    bt.disabled = true; bt.textContent = "送っています…";
    if (F.isDemo()) { bt.outerHTML = '<span class="badge-big badge-done" style="font-size:15px;padding:2px 10px;">参加済み（テスト）</span>'; return; }
    F.postGas({ action: "participate", no: rno, booth: bid, pin: PIN }).then(function (j) {
      if (handleAuthError_(j)) return;
      if (j && j.ok) { playFeedback("ok"); bt.outerHTML = '<span class="badge-big badge-done" style="font-size:15px;padding:2px 10px;">参加済み</span>'; }
      else { playFeedback("err"); bt.disabled = false; bt.textContent = "体験おわり"; box(F.$("#desk-msg"), "err", F.friendlyError(j && j.error)); }
    }).catch(function () { playFeedback("err"); bt.disabled = false; bt.textContent = "体験おわり"; box(F.$("#desk-msg"), "err", F.friendlyError("network")); });
  });
  F.$("#pin-btn").addEventListener("click", tryPin);
  F.$("#pin").addEventListener("keydown", function (e) { if (e.key === "Enter") tryPin(); });

  /* ---------- ② QR読み取り ---------- */
  var video = F.$("#video"), canvas = F.$("#canvas"), ctx = canvas.getContext("2d");
  var stream = null, scanning = false, rafId = 0;

  function stopScan() {
    scanning = false;
    if (rafId) { cancelAnimationFrame(rafId); rafId = 0; }
    if (stream) {
      stream.getTracks().forEach(function (t) { t.stop(); });
      stream = null;
    }
    F.$("#reader-box").hidden = true;
    F.$("#scan-stop").hidden = true;
    F.$("#scan-btn").hidden = false;
  }

  function startScan() {
    unlockAudio_();
    if (typeof jsQR !== "function") {
      box(F.$("#desk-msg"), "err", "QRの読み取り部品が読み込めませんでした。番号の手入力をお使いください。");
      return;
    }
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      box(F.$("#desk-msg"), "err", "この端末ではカメラが使えません。番号の手入力をお使いください。");
      return;
    }
    F.$("#desk-msg").innerHTML = "";
    var ua = navigator.userAgent || "";
    if (/Line\/|Instagram|FBAN|FBAV|Twitter|GSA\//.test(ua)) {
      box(F.$("#desk-msg"), "err", "LINEなどアプリの中のブラウザではカメラが使えません。右上や下のメニューから「Safariで開く」（Androidは「Chromeで開く」）にしてください。または下の「写真でQRを読む」をお使いください。");
      return;
    }
    F.$("#reader-box").hidden = false;
    video.setAttribute("playsinline", "true");
    video.setAttribute("autoplay", "true");
    video.muted = true;
    navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: "environment" } }, audio: false })
      .then(function (s) {
        stream = s;
        video.srcObject = s;
        var pr = video.play();
        return (pr && pr.then) ? pr : Promise.resolve();
      })
      .then(function () {
        F.$("#scan-stop").hidden = false;
        F.$("#scan-btn").hidden = true;
        scanning = true;
        tick();
      })
      .catch(function (err) {
        F.$("#reader-box").hidden = true;
        var n = (err && err.name) || "";
        var msg = "カメラが使えませんでした。";
        if (n === "NotAllowedError" || n === "SecurityError") msg = "カメラの許可が「許可しない」になっています。iPhoneは 設定→Safari→カメラ を「確認」か「許可」に、画面上部の「ぁあ」→Webサイトの設定 からも変えられます。";
        else if (n === "NotFoundError" || n === "OverconstrainedError") msg = "使えるカメラが見つかりませんでした。";
        else if (n === "NotReadableError") msg = "ほかのアプリがカメラを使っています。いちど閉じてからお試しください。";
        box(F.$("#desk-msg"), "err", msg + "（" + n + "）下の「写真でQRを読む」か、番号の手入力もお使いいただけます。");
      });
  }

  /* 写真でQRを読む（カメラが起動しないときの逃げ道。アプリ内ブラウザでも動く） */
  F.$("#photo-qr").addEventListener("change", function () {
    unlockAudio_();
    var f = this.files && this.files[0]; if (!f) return;
    var img = new Image();
    var url = URL.createObjectURL(f);
    img.onload = function () {
      var code = null, sizes = [1600, 1000, 640, 2200];
      for (var si = 0; si < sizes.length && !code; si++) {
        var sc = Math.min(1, sizes[si] / Math.max(img.width, img.height));
        canvas.width = Math.round(img.width * sc); canvas.height = Math.round(img.height * sc);
        ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        var d = ctx.getImageData(0, 0, canvas.width, canvas.height);
        code = (typeof jsQR === "function") ? jsQR(d.data, d.width, d.height, { inversionAttempts: "attemptBoth" }) : null;
      }
      URL.revokeObjectURL(url);
      var no = code && code.data ? pickNo(code.data) : "";
      if (no) { playFeedback("scan"); F.$("#no").value = no; lookup(no, F.$("#auto-checkin").checked); }
      else { playFeedback("err"); box(F.$("#desk-msg"), "err", "QRが読み取れませんでした。QRを大きく、明るく写してもう一度お試しください。"); }
    };
    img.onerror = function () { URL.revokeObjectURL(url); playFeedback("err"); box(F.$("#desk-msg"), "err", "この写真の形式は読めませんでした。番号の手入力をお使いください。"); };
    img.src = url;
    this.value = "";
  });

  function tick() {
    if (!scanning) return;
    if (video.readyState === video.HAVE_ENOUGH_DATA) {
      var vw = video.videoWidth, vh = video.videoHeight, sc = Math.min(1, 800 / Math.max(vw, vh));
      canvas.width = Math.round(vw * sc);
      canvas.height = Math.round(vh * sc);
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      var img = ctx.getImageData(0, 0, canvas.width, canvas.height);
      var code = jsQR(img.data, img.width, img.height, { inversionAttempts: "attemptBoth" });
      if (code && code.data) {
        var no = pickNo(code.data);
        if (no) {
          stopScan();
          playFeedback("scan");
          F.$("#no").value = no;
          lookup(no, F.$("#auto-checkin").checked);
          return;
        }
      }
    }
    rafId = requestAnimationFrame(tick);
  }

  /* QRの中身から KF-0000 の形をとり出す（URLが入っていても拾えるように） */
  function pickNo(text) {
    var m = String(text).toUpperCase().match(/KF-?\d{3,6}/);
    if (!m) return "";
    return "KF-" + m[0].replace(/^KF-?/, "");
  }

  F.$("#scan-btn").addEventListener("click", startScan);
  F.$("#scan-stop").addEventListener("click", stopScan);

  /* ---------- 照会＆1回通信チェックイン ---------- */
  function normalizeNo(v) {
    var s = String(v).trim().toUpperCase().replace(/\s/g, "");
    var m = s.match(/^(?:KF-?)?(\d+)$/);
    if (!m) return s;
    var n = m[1];
    while (n.length < 4) { n = "0" + n; }   /* 12 → KF-0012 */
    return "KF-" + n;
  }

  /* POST lookup（v1.3.3）を優先し、v1.3.2（error==="action"）なら自動で GET lookup にフォールバック */
  function fetchLookup_(no) {
    return F.postGas({ action: "lookup", no: no, pin: PIN }).then(function (j) {
      if (j && j.error === "action") return F.getGas({ action: "lookup", no: no, pin: PIN });
      return j;
    });
  }

  function lookup(rawNo, fromQr) {
    var no = normalizeNo(rawNo);
    if (!no) { box(F.$("#desk-msg"), "err", "番号を入れてください。"); return; }
    var useAutoCheckin = !!fromQr && F.$("#auto-checkin").checked;
    F.$("#desk-msg").innerHTML = '<p class="muted">' + (useAutoCheckin ? "来場受付をしています…" : "調べています…") + "</p>";
    F.$("#result-card").hidden = true;

    if (F.isDemo()) {
      /* テスト表示のときだけ：KF-0002 を入れると「来場のみ」の方の見本が出ます（練習用）。
         KF-0003 は「取消済み」の見本（名前と生年月日で探す の練習用・2026-11-11） */
      var demoVisit = (no === "KF-0002"), demoCanceled = (no === "KF-0003");
      window.setTimeout(function () {
        F.$("#desk-msg").innerHTML = "";
        if (useAutoCheckin) {
          if (demoCanceled) {
            playFeedback("err");
            box(F.$("#desk-msg"), "err", F.friendlyError("canceled"));
            showPerson({
              no: no, name: "（テスト表示）お名前", kana: "", adults: 2, children: 1,
              booths: [], visitOnly: true, checkedIn: false, canceled: true
            });
            return;
          }
          var wasAlready = !!demoCame[no];
          if (!wasAlready) demoCame[no] = "10:15";
          if (wasAlready) {
            playFeedback("already");
            box(F.$("#desk-msg"), "info", "⚠️ すでに来場受付が済んでいます（受付時刻: " + demoCame[no] + "）※2回目の読み取りです");
          } else {
            playFeedback("ok");
            box(F.$("#desk-msg"), "ok", "✅ 来場受付が完了しました（テスト）");
          }
          showPerson({
            no: no, name: "（テスト表示）お名前", kana: "", adults: 2, children: 1,
            booths: demoVisit ? [] : [{ id: "haihai", name: "ハイハイレース", time: "10:50〜11:20" }],
            visitOnly: demoVisit,
            checkedIn: true,
            checkedInAt: demoCame[no],
            already: wasAlready,
            justCheckedIn: !wasAlready,
            canceled: false
          });
          return;
        }
        if (demoCanceled) playFeedback("err");
        else if (demoCame[no]) playFeedback("already");
        showPerson({
          no: no, name: "（テスト表示）お名前", kana: "", adults: 2, children: 1,
          booths: demoVisit ? [] : [{ id: "haihai", name: "ハイハイレース", time: "10:50〜11:20" }],
          visitOnly: demoVisit,
          checkedIn: !!demoCame[no],
          checkedInAt: demoCame[no] || "",
          already: !!demoCame[no],
          canceled: demoCanceled
        });
      }, 200);
      return;
    }

    /* ① 自動チェックインON時：GET lookup を送らず、直接 POST checkin を1回だけ送信（速度2倍＆負荷半減） */
    if (useAutoCheckin) {
      F.postGas({ action: "checkin", no: no, pin: PIN }).then(function (j) {
        if (handleAuthError_(j)) return;
        F.$("#desk-msg").innerHTML = "";
        if (j && j.ok === true) {
          if (j.already) {
            playFeedback("already");
            var atTxt = j.checkedInAt ? "（受付時刻: " + j.checkedInAt + "）" : "";
            box(F.$("#desk-msg"), "info", "⚠️ すでに来場受付が済んでいます" + atTxt + " ※2回目の読み取りです");
            j.justCheckedIn = false;
          } else {
            playFeedback("ok");
            box(F.$("#desk-msg"), "ok", "✅ 来場受付が完了しました");
            j.justCheckedIn = true;
          }
          showPerson(j);
        } else if (j && j.error === "canceled") {
          playFeedback("err");
          box(F.$("#desk-msg"), "err", F.friendlyError("canceled"));
          if (Array.isArray(j.booths)) {
            j.canceled = true;
            showPerson(j);
          } else {
            /* 現行 v1.3.2 互換：booths が含まれていない場合は lookup で詳細を取得して赤バッジ表示 */
            fetchLookup_(no).then(function (lk) {
              if (lk && lk.ok) { lk.canceled = true; showPerson(lk); }
              else showPerson({ no: no, name: j.name || "", canceled: true, booths: [] });
            }).catch(function () {
              showPerson({ no: no, name: j.name || "", canceled: true, booths: [] });
            });
          }
        } else {
          playFeedback("err");
          box(F.$("#desk-msg"), "err", F.friendlyError(j && j.error));
        }
      }).catch(function () {
        playFeedback("err");
        box(F.$("#desk-msg"), "err", F.friendlyError("network"));
      });
      return;
    }

    /* 自動チェックインOFF時・番号手入力・名前検索からの照会 */
    fetchLookup_(no).then(function (j) {
      if (handleAuthError_(j)) return;
      F.$("#desk-msg").innerHTML = "";
      if (j && j.ok === true) {
        if (j.canceled) {
          playFeedback("err");
          box(F.$("#desk-msg"), "err", F.friendlyError("canceled"));
        } else if (j.checkedIn) {
          playFeedback("already");
          j.already = true;
        }
        showPerson(j);
      } else {
        playFeedback("err");
        box(F.$("#desk-msg"), "err", F.friendlyError(j && j.error));
      }
    }).catch(function () {
      playFeedback("err");
      box(F.$("#desk-msg"), "err", F.friendlyError("network"));
    });
  }

  F.$("#lookup-btn").addEventListener("click", function () { unlockAudio_(); lookup(F.$("#no").value, false); });
  F.$("#no").addEventListener("keydown", function (e) { if (e.key === "Enter") { unlockAudio_(); lookup(F.$("#no").value, false); } });

  /* ---------- 名前と生年月日で探す（2026-11-11） ----------
     受付係（GAS）の action search に、お名前と生年月日を送る（POST＝URLに名前を残さない）。
     候補が1件なら、そのまま番号照会（lookup）へ。複数ならボタンを並べる。0件なら予約なしの来場登録へ案内 */
  var sList = F.$("#search-list");
  if (F.isDemo()) F.$("#search-demo").hidden = false;

  /* 生年月日を YYYYMMDD に（受付係の personKey_ と同じ決まり。全角数字・「年月日」もOK） */
  function birth8(v) {
    var s = String(v || "").replace(/[０-９]/g, function (c) { return String.fromCharCode(c.charCodeAt(0) - 0xFEE0); });
    var parts = s.split(/\D+/).filter(Boolean);
    if (parts.length === 3) return parts[0] + ("0" + Number(parts[1])).slice(-2) + ("0" + Number(parts[2])).slice(-2);
    return parts.join("");
  }

  /* テスト表示用の架空の候補（本物の名前は使わない） */
  function demoSearch(name) {
    if (name === "テスト花子") return [{ no: "KF-0000", name: "テスト花子", status: "予約", visitOnly: false, canceled: false, partial: false }];
    if (name === "テスト家族") return [
      { no: "KF-0000", name: "テスト花子", status: "予約", visitOnly: false, canceled: false, partial: false },
      { no: "KF-0002", name: "テスト太郎", status: "予約", visitOnly: true, canceled: false, partial: false },
      { no: "KF-0004", name: "テスト三郎", status: "予約", visitOnly: true, canceled: false, partial: true },
      { no: "KF-0003", name: "テスト次郎", status: "キャンセル", visitOnly: true, canceled: true, partial: false }
    ];
    return [];
  }

  function pickCandidate(no) {
    sList.innerHTML = "";
    F.$("#no").value = no;
    lookup(no, false);   /* 番号照会と同じ処理（来場にするボタンは、スタッフが名前を確かめてから押す） */
  }

  function showCandidates(list, more) {
    if (!list.length) {
      sList.innerHTML = '<div class="msg msg-info">見つかりませんでした。予約なしの方の来場登録へ' +
        '<button type="button" class="btn btn-line" id="s-to-walkin" style="margin:8px 0 0;">来場登録の欄へ移る（お名前と生年月日を入れておきます）</button></div>';
      F.$("#s-to-walkin").addEventListener("click", goWalkin);
      return;
    }
    /* 1件で取消済みでなければ、そのまま照会へ */
    if (list.length === 1 && !list[0].canceled) {
      if (list[0].partial) box(sList, "info", "生年月日が途中まで登録されている方です。お名前と住所などで本人かお確かめください。");
      else sList.innerHTML = "";
      F.$("#no").value = list[0].no;
      lookup(list[0].no, false);
      return;
    }
    sList.innerHTML = '<p class="small" style="margin:0 0 6px;">' + (list.length === 1 ? "1件" : list.length + "件") + "見つかりました。押すと予約の中身が出ます。</p>" +
      list.map(function (c) {
        var tag = c.canceled ? "取消済み" : (c.status === "来場" ? "来場ずみ" : (c.visitOnly ? "来場のみ" : "体験の予約"));
        return '<button type="button" class="btn btn-line s-pick" data-no="' + esc(c.no) + '" style="display:block;text-align:left;height:auto;min-height:56px;padding:8px 14px;margin:0 0 8px;' + (c.canceled ? "opacity:.7;" : "") + '">' +
          '<b style="font-size:18px;">' + esc(c.no) + "　" + esc(c.name) + " 様</b>" +
          '<span style="display:block;font-size:14px;font-weight:400;">' + esc(tag) + (c.canceled ? "（この番号では来場にできません）" : "") + "</span>" +
          (c.partial ? '<span style="display:block;font-size:13px;font-weight:400;color:#FFDD72;">生年月日が途中まで登録されています</span>' : "") +
          "</button>";
      }).join("") +
      (more ? '<p class="small" style="margin:0;">ほかにも候補があります。お名前を正確に入れ直してください。</p>' : "");
  }

  function goWalkin() {
    /* 予約なしの来場登録の1行目が空なら、探したお名前と生年月日を入れておく */
    var first = F.$("[data-wperson]");
    if (first) {
      var wn = first.querySelector(".w-name"), wb = first.querySelector(".w-birth");
      if (wn && !wn.value) wn.value = F.$("#s-name").value.trim();
      if (wb && !wb.value) wb.value = F.$("#s-birth").value.trim();
    }
    F.$("#w-people").closest(".card").scrollIntoView({ behavior: "smooth", block: "start" });
  }

  sList.addEventListener("click", function (e) {
    var b = e.target.closest ? e.target.closest(".s-pick") : null;
    if (b) pickCandidate(b.getAttribute("data-no"));
  });

  function doSearch() {
    unlockAudio_();
    var rawName = F.$("#s-name").value, rawBirth = F.$("#s-birth").value;
    var name = rawName.replace(/[\s　]/g, ""), b8 = birth8(rawBirth);
    if (!name || !rawBirth.trim()) { box(sList, "err", "お名前と生年月日の両方を入れてください。"); return; }
    if (!/^\d{8}$/.test(b8)) { box(sList, "err", "生年月日は「1985/4/1」「19850401」「1985年4月1日」のように入れてください。"); return; }
    F.$("#result-card").hidden = true;
    sList.innerHTML = '<p class="muted">探しています…</p>';
    var sbtn = F.$("#search-btn");

    if (F.isDemo()) { window.setTimeout(function () { showCandidates(demoSearch(name), false); }, 300); return; }

    sbtn.disabled = true;
    F.postGas({ action: "search", name: rawName.trim(), birth: rawBirth.trim(), pin: PIN }).then(function (j) {
      sbtn.disabled = false;
      if (handleAuthError_(j)) return;
      if (j && j.ok === true) showCandidates(j.candidates || [], !!j.more);
      else if (j && j.error === "invalid") box(sList, "err", j.message || "お名前と生年月日を確かめてください。");
      else box(sList, "err", F.friendlyError(j && j.error));
    }).catch(function () {
      sbtn.disabled = false;
      box(sList, "err", F.friendlyError("network"));
    });
  }
  F.$("#search-btn").addEventListener("click", doSearch);
  F.$("#s-birth").addEventListener("keydown", function (e) { if (e.key === "Enter") doSearch(); });

  function setCardBanner_(kind, text) {
    var bnr = F.$("#r-banner");
    if (!bnr) return;
    if (!kind || !text) {
      bnr.hidden = true;
      bnr.className = "r-banner";
      bnr.textContent = "";
      return;
    }
    bnr.hidden = false;
    bnr.className = "r-banner r-banner-" + kind;
    bnr.textContent = text;
  }

  function showPerson(p) {
    F.$("#result-card").hidden = false;
    F.$("#r-no").textContent = p.no;
    F.$("#r-name").textContent = p.name || "";
    F.$("#r-kana").textContent = p.kana || "";
    F.$("#r-count").textContent = "大人 " + (p.adults || 0) + "名／子ども " + (p.children || 0) + "名";

    var badge = F.$("#r-badge");
    if (p.canceled) {
      /* 取り消された予約。赤バッジで大きく表示し、カード上部にも警告を出す */
      badge.className = "badge-big badge-cancel";
      badge.textContent = "取消済み（受付不可）";
      setCardBanner_("cancel", "❌ このご予約はキャンセル（取消）されています（この番号では受付できません）");
    } else if (p.already) {
      /* すでに来場受付済み（2回目以降の読み取り・別スタッフとの同時読み取り） */
      var atLabel = p.checkedInAt ? "（受付時刻: " + p.checkedInAt + "）" : "";
      badge.className = "badge-big badge-already";
      badge.textContent = "⚠️ すでに来場受付が済んでいます" + atLabel;
      setCardBanner_("already", "⚠️ すでに来場受付が済んでいます" + atLabel + " ※2回目の読み取りです");
    } else if (p.checkedIn) {
      badge.className = "badge-big badge-done";
      badge.textContent = "来場ずみ" + (p.checkedInAt ? "（" + p.checkedInAt + "）" : "");
      if (p.justCheckedIn) {
        setCardBanner_("ok", "✅ 来場受付が完了しました" + (p.checkedInAt ? "（" + p.checkedInAt + "）" : ""));
      } else {
        setCardBanner_("", "");
      }
    } else {
      badge.className = "badge-big badge-yet";
      badge.textContent = "まだ来場していません";
      setCardBanner_("", "");
    }

    var bs = p.booths || [];
    /* 来場のみの登録（体験の予約なし）＝受付係が visitOnly／種別 visit を返します */
    var visitOnly = (p.visitOnly === true) || (String(p.type || "") === "visit");
    var visitLine = '<div class="booth-line"><b>来場のみ</b>　空いているブースへご案内してください</div>';
    var showPartBtn = !!(boothModeChk && boothModeChk.checked);
    F.$("#r-booths").innerHTML = (visitOnly ? visitLine : "") + (bs.length
      ? bs.map(function (b) {
          var full = F.booth(b.id);
          var time = b.time || (full ? full.time : "");
          var done = (b.status === "参加済み");
          return '<div class="booth-line">' + esc(b.name || (full ? full.name : b.id)) +
            (b.people > 1 ? "　" + esc(String(b.people)) + "名" : "") +
            (time ? '　<span class="small">' + esc(time) + "</span>" : "") +
            (done ? '　<span class="badge-big badge-done" style="font-size:15px;padding:2px 10px;">参加済み</span>'
                  : '　<button type="button" class="btn btn-line booth-part-btn"' + (showPartBtn ? "" : " hidden") + ' style="display:inline-flex;width:auto;min-height:40px;padding:6px 12px;font-size:15px;margin:0;" data-part="' + esc(b.id) + '" data-no="' + esc(p.no) + '">体験おわり</button>') +
            /* 受付での声かけ（booths.json の deskNote。2026-11-10 追加） */
            (!done && full && full.deskNote
              ? '<div style="margin:6px 0 2px;padding:8px 12px;background:#FFF4D6;border-left:5px solid #E8A33D;border-radius:6px;font-size:16px;font-weight:700;line-height:1.5;color:#3A2A00;">📣 ' + esc(full.deskNote) + "</div>"
              : "") +
            "</div>";
        }).join("")
      : (visitOnly ? "" : '<div class="booth-line">予約ブースなし</div>'));
    F.$("#r-booth-mode-wrap").hidden = (bs.length === 0);
    syncBoothStaffMode_();

    /* 来場のみの方が、その場で空いているブースに入ったときの記録 */
    var spot = F.$("#r-spot");
    if (visitOnly) {
      spot.hidden = false;
      spot.innerHTML = '<p class="small" style="margin:0;">いま案内できるブースを調べています…</p>';
      var spotNo = p.no;
      var drawSpot = function (stat) {
        if (F.$("#r-no").textContent !== spotNo) return;   /* 調べている間に別の人に切り替わったら描かない */
        var opts = spotOptions(stat);
        spot.innerHTML = '<p class="small" style="margin:0 0 6px;font-weight:700;">いま案内できるブース（入ったら記録・任意）</p>' +
          (opts.length
            ? '<select id="spot-booth" style="width:100%;min-height:48px;font-size:16px;font-family:inherit;margin-bottom:8px;">' +
              '<option value="">（入ったブースがあれば選ぶ）</option>' +
              opts.map(function (o) {
                return '<option value="' + esc(o.id) + '" data-name="' + esc(o.name) + '" data-time="' + esc(o.time) + '">' + esc(o.label) + "</option>";
              }).join("") +
              "</select>" +
              '<button type="button" class="btn btn-line" id="spot-btn" style="margin-bottom:0;">このブースに入った</button>' +
              (stat ? "" : '<p class="small" style="margin:6px 0 0;">※ 残りの数を読めなかったので、全部のブースを出しています</p>')
            : '<p class="small" style="margin:0;">いま案内できるブースはありません。</p>');
        var sb = F.$("#spot-btn");
        if (sb) sb.addEventListener("click", function () { spotJoin(spotNo, this); });
      };
      F.fetchStatus().then(drawSpot).catch(function () { drawSpot(null); });
    } else {
      spot.hidden = true;
      spot.innerHTML = "";
    }

    var act = F.$("#r-actions");
    act.innerHTML = "";
    if (!p.checkedIn && !p.canceled) {
      var b1 = document.createElement("button");
      b1.type = "button";
      b1.className = "btn btn-go";
      b1.textContent = "来場にする";
      b1.addEventListener("click", function () { doCheckin(p.no, b1); });
      act.appendChild(b1);
    }
    var b2 = document.createElement("button");
    b2.type = "button";
    b2.className = "btn btn-line";
    b2.textContent = "続けて次の人を読む";
    b2.addEventListener("click", nextPerson);
    act.appendChild(b2);

    F.$("#result-card").scrollIntoView({ behavior: "smooth", block: "start" });
  }

  /* いま案内できるブースの一覧（2026-11-11）
     ・集団の体験（運動あそび・クバトレ・レース）… 終わりの時刻を過ぎていない＋予約（と受付で記録した人）で枠が埋まっていないものだけ。残りの数つき。
       事前予約の「受付中」（締め切り）は見ない。当日は空いていれば入れるため。
     ・ケアブース（足もみ・整体・MK2・クバトレのコンディショニング）… 予約はそれぞれの時間の最初の数分だけなので、
       予約で埋まっていても空いている時間に入れる。同じ名前の枠は1行にまとめ、15:00まで出す。
     ・時刻で消すのは開催日（booths.json の event.date）だけ。前日までのリハーサルでは全部出る。
     stat … fetchStatus() の結果（読めなかったときは null → 残りの数なしで全部出す） */
  /* 足もみ・ゆいまーるの当日枠（GAS の DAY_SLOTS と同じ中身にする） */
  var DAY_SLOTS = {
    ashimomi: { mins: 10, times: ["10:30", "11:30", "12:30", "13:30", "14:30"] },
    seitai_yuimaru: { mins: 20, times: ["10:30", "11:30", "12:30", "13:30", "14:30"] }
  };
  function spotOptions(stat) {
    var now = new Date(Date.now() + 9 * 3600 * 1000);   /* 日本時間 */
    var today = now.getUTCFullYear() + "-" + ("0" + (now.getUTCMonth() + 1)).slice(-2) + "-" + ("0" + now.getUTCDate()).slice(-2);
    var isDay = (today === String((F.DATA.event || {}).date || ""));
    var nowMin = now.getUTCHours() * 60 + now.getUTCMinutes();
    var toMin = function (s) { var m = /(\d{1,2}):(\d{2})/.exec(s || ""); return m ? Number(m[1]) * 60 + Number(m[2]) : null; };
    var endMin = function (t) { var m = /〜\s*(\d{1,2}:\d{2})/.exec(t || ""); return m ? toMin(m[1]) : null; };
    var parentOf = {};
    F.DATA.booths.forEach(function (b) { (b.slots || []).forEach(function (s) { parentOf[s] = b; }); });

    var group = [], care = [], seen = {};
    F.DATA.booths.forEach(function (b) {
      if (b.slots) return;
      if (F.isCareBooth(b.id)) {
        if (isDay && nowMin >= 15 * 60) return;
        var par = parentOf[b.id];
        var key = par ? par.id : b.id;
        if (seen[key]) return;
        seen[key] = true;
        /* 足もみ・ゆいまーる：空いている枠だけを時間ごとに出す（予約枠の空き＋当日枠 10:30〜14:30）（2026-11-12） */
        var dc = DAY_SLOTS[key];
        if (dc && stat && stat[key + "_" + dc.times[0].replace(":", "")]) {
          var cand = [];
          (par.slots || []).forEach(function (sid) {
            var sb = F.booth(sid); if (!sb) return;
            cand.push({ id: sid, start: toMin(sb.start || sb.time), name: par.name + " " + (sb.start || "") + "の枠", time: sb.time || "" });
          });
          dc.times.forEach(function (t) {
            var st0 = toMin(t);
            var en = st0 + dc.mins, end = ("0" + Math.floor(en / 60)).slice(-2) + ":" + ("0" + (en % 60)).slice(-2);
            cand.push({ id: key + "_" + t.replace(":", ""), start: st0, name: par.name + " " + t + "の当日枠", time: t + "〜" + end });
          });
          cand.sort(function (a, c) { return a.start - c.start; });
          cand.forEach(function (c) {
            if (isDay && c.start !== null && nowMin >= c.start + dc.mins) return;   // もう終わった枠
            var s0 = stat[c.id];
            if (!s0 || Number(s0.capacity || 0) - Number(s0.reserved || 0) <= 0) return;   // 埋まっている枠
            care.push({ id: c.id, name: c.name, time: c.time, label: c.name + "　" + c.time + "（空き）" });
          });
          return;
        }
        var nm = par ? par.name : String(b.name || "").replace(/\s*\d{1,2}:\d{2}の枠$/, "");
        care.push({ id: key, name: nm, time: "", label: nm + "（空いている時間に）" });
        return;
      }
      var end = endMin(b.time);
      if (isDay && end !== null && nowMin >= end) return;
      var left = null;
      if (stat && stat[b.id]) {
        left = Math.max(0, Number(stat[b.id].capacity || 0) - Number(stat[b.id].reserved || 0));
        if (left <= 0) return;
      }
      group.push({ id: b.id, name: b.name, time: b.time || "", start: toMin(b.time),
        label: b.name + "　" + (b.time || "") + (left !== null ? "（残り" + left + (F.isRace(b) ? "組" : "名") + "）" : "") });
    });
    group.sort(function (a, b) { return (a.start || 0) - (b.start || 0); });
    return group.concat(care);
  }

  /* 予約していないブースに、その場で入ったことを記録する（来場のみの方むけ） */
  function spotJoin(no, btn) {
    var sel = F.$("#spot-booth");
    if (!sel) return;
    if (!sel.value) { box(F.$("#desk-msg"), "err", "入ったブースを選んでから押してください。"); return; }
    var opt = sel.options[sel.selectedIndex];
    var b = F.booth(sel.value) || { name: opt.getAttribute("data-name") || sel.value, time: opt.getAttribute("data-time") || "" };
    btn.disabled = true; btn.textContent = "記録しています…";
    var finish = function (ok, msg) {
      if (F.$("#r-no").textContent !== no) return;
      btn.disabled = false; btn.textContent = "このブースに入った";
      box(F.$("#desk-msg"), ok ? "ok" : "err", msg);
    };
    if (F.isDemo()) {
      window.setTimeout(function () {
        if (F.$("#r-no").textContent !== no) return;
        F.$("#r-booths").insertAdjacentHTML("beforeend", '<div class="booth-line">' + esc(b ? b.name : sel.value) + '　<span class="badge-big badge-done" style="font-size:15px;padding:2px 10px;">参加済み（テスト）</span></div>');
        finish(true, "記録しました（テスト）。");
      }, 300);
      return;
    }
    F.postGas({ action: "participate", no: no, booth: sel.value, add: true, pin: PIN, boothName: b ? b.name : "", boothTime: b ? b.time : "" })
      .then(function (j) {
        if (handleAuthError_(j)) return;
        if (F.$("#r-no").textContent !== no) return;
        if (j && j.ok) {
          playFeedback("ok");
          F.$("#r-booths").insertAdjacentHTML("beforeend", '<div class="booth-line">' + esc(b ? b.name : sel.value) + '　<span class="badge-big badge-done" style="font-size:15px;padding:2px 10px;">参加済み</span></div>');
          finish(true, "「" + (b ? b.name : sel.value) + "」に入ったことを記録しました。");
        } else if (j && j.error === "full") {
          playFeedback("err");
          finish(false, (j.message || "その枠は、もう埋まっています") + "。画面を開きなおすと、いま空いている枠が出ます。");
        } else {
          playFeedback("err");
          finish(false, F.friendlyError(j && j.error));
        }
      })
      .catch(function () { playFeedback("err"); finish(false, F.friendlyError("network")); });
  }

  function doCheckin(no, btn) {
    unlockAudio_();
    btn.disabled = true;
    btn.textContent = "記録しています…";

    var finish = function (ok, already, checkedInAt) {
      if (F.$("#r-no").textContent !== no) return;
      if (ok) {
        var badge = F.$("#r-badge");
        var atTxt = checkedInAt ? "（受付時刻: " + checkedInAt + "）" : "";
        if (already) {
          playFeedback("already");
          btn.textContent = "来場ずみ（既受付）";
          badge.className = "badge-big badge-already";
          badge.textContent = "⚠️ すでに来場受付が済んでいます" + atTxt;
          setCardBanner_("already", "⚠️ すでに来場受付が済んでいます" + atTxt + " ※2回目の読み取りです");
          box(F.$("#desk-msg"), "info", "⚠️ すでに来場受付が済んでいます" + atTxt + " ※2回目の読み取りです");
        } else {
          playFeedback("ok");
          btn.textContent = "来場にしました";
          badge.className = "badge-big badge-done";
          badge.textContent = "来場ずみ" + (checkedInAt ? "（" + checkedInAt + "）" : "");
          setCardBanner_("ok", "✅ 来場受付が完了しました" + (checkedInAt ? "（" + checkedInAt + "）" : ""));
          box(F.$("#desk-msg"), "ok", "✅ 来場受付が完了しました");
        }
      } else {
        btn.disabled = false;
        btn.textContent = "来場にする";
      }
    };

    if (F.isDemo()) {
      window.setTimeout(function () {
        if (F.$("#r-no").textContent !== no) return;
        var wasAlready = !!demoCame[no];
        if (!wasAlready) demoCame[no] = "10:15";
        finish(true, wasAlready, demoCame[no]);
      }, 300);
      return;
    }

    F.postGas({ action: "checkin", no: no, pin: PIN }).then(function (j) {
      if (handleAuthError_(j)) return;
      if (F.$("#r-no").textContent !== no) return;
      if (j && j.ok === true) {
        finish(true, !!j.already, j.checkedInAt || "");
      } else {
        playFeedback("err");
        if (j && j.error === "canceled") {
          var badge = F.$("#r-badge");
          badge.className = "badge-big badge-cancel";
          badge.textContent = "取消済み（受付不可）";
          setCardBanner_("cancel", "❌ このご予約はキャンセル（取消）されています（この番号では受付できません）");
        }
        box(F.$("#desk-msg"), "err", F.friendlyError(j && j.error));
        finish(false);
      }
    }).catch(function () {
      if (F.$("#r-no").textContent !== no) return;
      playFeedback("err");
      box(F.$("#desk-msg"), "err", F.friendlyError("network"));
      finish(false);
    });
  }

  function nextPerson() {
    F.$("#result-card").hidden = true;
    setCardBanner_("", "");
    F.$("#no").value = "";
    F.$("#desk-msg").innerHTML = "";
    startScan();
  }

  /* ---------- 予約なしの来場登録 ---------- */
  var wbtn = F.$("#walkin-btn");
  var wPeople = F.$("#w-people");
  function wRow(i) {
    return '<div class="card" data-wperson style="padding:12px;">' +
      '<p class="small" style="margin:0 0 6px;font-weight:700;">' + (i === 0 ? "代表の方" : "いっしょの方") + "</p>" +
      '<div class="field" style="margin-bottom:8px;"><label>お名前</label><input type="text" class="w-name" autocomplete="off"></div>' +
      '<div class="field" style="margin-bottom:8px;"><label>生年月日</label><input type="text" class="w-birth" inputmode="numeric" placeholder="1985/4/1" autocomplete="off"></div>' +
      '<div class="field" style="margin-bottom:4px;"><label>区分</label><select class="w-kind"><option value="大人">大人</option><option value="子ども">子ども</option></select></div>' +
      (i > 0 ? '<button type="button" class="btn btn-line w-del" style="min-height:36px;margin:4px 0 0;">この行を消す</button>' : "") + "</div>";
  }
  function wAdd() { wPeople.insertAdjacentHTML("beforeend", wRow(F.$$("[data-wperson]").length)); }
  wAdd();
  F.$("#w-add").addEventListener("click", wAdd);
  wPeople.addEventListener("click", function (e) { var d = e.target.closest ? e.target.closest(".w-del") : null; if (d) d.closest("[data-wperson]").remove(); });
  function wReset() { wPeople.innerHTML = ""; wAdd(); F.$("#w-address").value = ""; F.$("#w-phone").value = ""; }
  wbtn.addEventListener("click", function () {
    unlockAudio_();
    var people = F.$$("[data-wperson]").map(function (r) {
      return { name: r.querySelector(".w-name").value.trim(), birth: r.querySelector(".w-birth").value.trim(), kind: r.querySelector(".w-kind").value, join: true };
    }).filter(function (pp) { return pp.name; });
    if (!people.length) { box(F.$("#walkin-msg"), "err", "お名前を入れてください。"); return; }
    var adults = 0, children = 0;
    people.forEach(function (pp) { if (pp.kind === "子ども") children++; else adults++; });
    var payload = { action: "walkin", pin: PIN, name: people[0].name, birth: people[0].birth, people: people,
      address: F.$("#w-address").value.trim(), phone: F.$("#w-phone").value.trim(), adults: adults, children: children };
    if (F.isDemo()) {
      playFeedback("ok");
      box(F.$("#walkin-msg"), "ok", "登録しました（テスト）。" + people.length + "名。番号は KF-0101 です。");
      wReset(); return;
    }
    wbtn.disabled = true; wbtn.textContent = "送っています…";
    F.postGas(payload).then(function (j) {
      wbtn.disabled = false; wbtn.textContent = "来場を登録する";
      if (handleAuthError_(j)) return;
      if (j && j.ok) { playFeedback("ok"); box(F.$("#walkin-msg"), "ok", "登録しました。" + people.length + "名。番号は " + j.no + " です。バンドをお渡しください。"); wReset(); }
      else { playFeedback("err"); box(F.$("#walkin-msg"), "err", F.friendlyError(j && j.error)); }
    }).catch(function () {
      wbtn.disabled = false; wbtn.textContent = "来場を登録する";
      playFeedback("err");
      box(F.$("#walkin-msg"), "err", F.friendlyError("network"));
    });
  });
})();
</script>
